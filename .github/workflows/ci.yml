name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: |
          sudo apt-get install -y lua5.4 || true
          luac5.4 -p OnlineCheck/OnlineCheck.lua tests/*.lua
      - name: Tests
        run: lua5.4 tests/test_onlinecheck.lua
