name: curseforge-upload

# Send an already-published release to CurseForge.
#
# The tag workflow publishes to GitHub first and CurseForge second, so a
# failure on the second leaves a perfectly good release that CurseForge
# never received. That happened with v1.1.2 on a 500 from their end, and
# without this the only way to retry was to invent v1.1.3 -- a version
# number standing in for a retry button.
#
# This takes the zip GitHub already has, so what reaches CurseForge is
# byte-for-byte what the tag published rather than a fresh build of it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload, e.g. v1.1.2"
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --pattern OnlineCheck.zip --clobber
          unzip -l OnlineCheck.zip

      - name: Check it is not already there
        run: |
          # The TOC version has to match the tag, which is what the release
          # workflow enforced when it built this. Re-checking here means a
          # mistyped tag input cannot publish the wrong build.
          TAG="${{ inputs.tag }}"; TAG="${TAG#v}"
          TOC=$(unzip -p OnlineCheck.zip OnlineCheck/OnlineCheck.toc \
                | grep -oP '^## Version:\s*\K.*' | tr -d '\r')
          echo "tag=$TAG toc=$TOC"
          [ "$TAG" = "$TOC" ] || { echo "::error::tag $TAG does not match TOC $TOC"; exit 1; }

      - name: CurseForge upload
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_VERSION_NAME: ${{ vars.CURSEFORGE_GAME_VERSION || '2.5.6' }}
          CF_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
        run: scripts/curseforge-upload.sh OnlineCheck.zip "${{ inputs.tag }}"
