name: release

# Tests run before anything is packaged, and the zip is built from the tagged
# tree -- so what a release contains is exactly what the tag says it is.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Tests
        run: |
          luac5.4 -p OnlineCheck/OnlineCheck.lua tests/*.lua
          lua5.4 tests/test_onlinecheck.lua

      - name: Check the tag matches the TOC version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOC=$(grep -oP '^## Version:\s*\K.*' OnlineCheck/OnlineCheck.toc | tr -d '\r')
          echo "tag=$TAG toc=$TOC"
          [ "$TAG" = "$TOC" ] || { echo "::error::tag $TAG does not match TOC version $TOC"; exit 1; }

      - name: Package
        run: |
          # The addon folder plus its licence. Tests, CI and the CurseForge
          # notes are not shipped to players; the licence is, because a copy
          # of the code that travels without its terms is not licensed to
          # anybody.
          cp LICENSE OnlineCheck/LICENSE
          zip -r OnlineCheck.zip OnlineCheck -x '*.DS_Store'
          unzip -l OnlineCheck.zip
          # Exactly the three intended files, so an accidental addition to the
          # addon folder fails the release instead of shipping unnoticed.
          test "$(unzip -Z1 OnlineCheck.zip | grep -vc '/$')" = "3"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" OnlineCheck.zip --generate-notes

      # Runs once CURSEFORGE_PROJECT_ID (a repository variable) and
      # CURSEFORGE_TOKEN (a secret) are both set. With the token missing this
      # warns and skips rather than failing: the GitHub release has already
      # been published by the step above, and marking the run red for an
      # optional destination would say something untrue about it.
      - name: CurseForge upload
        if: vars.CURSEFORGE_PROJECT_ID != ''
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_VERSION_NAME: ${{ vars.CURSEFORGE_GAME_VERSION || '2.5.6' }}
          CF_VERSION_ID: ${{ vars.CURSEFORGE_GAME_VERSION_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning::CURSEFORGE_TOKEN is not set, so this release went to GitHub only."
            exit 0
          fi
          scripts/curseforge-upload.sh OnlineCheck.zip "$GITHUB_REF_NAME"
